<!DOCTYPE html>
<head>
<title> </title>
<style>

    h1 {
        color: azure
    }

                /* Reset default margins and padding */
    body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    }

    /* The Top Bar Container */
    .top-bar {
    position: fixed;        /* Locks the bar to the top of the screen */
    top: 0;
    left: 0;
    width: 100%;            /* Spans the full width of the screen */
    height: 60px;
    background-color: #333; /* Dark background */
    display: flex;          /* Uses Flexbox to align content */
    justify-content: space-between; /* Pushes logo to left, links to right */
    align-items: center;    /* Centers items vertically */
    padding: 0 20px;        /* Side padding inside the bar */
    box-sizing: border-box;
    z-index: 1000;          /* Ensures it stays on top of other content */
    }

    /* Logo Styling */
    .logo {
    color: azure;
    font-size: 20px;
    font-weight: bold;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    /* Navigation Links Container */
    .nav-links {
    list-style: none;       /* Removes bullet points */
    display: inline-flex;          /* Aligns links horizontally in a row */
    margin: 10px;
    padding: 0;
    white-space: nowrap;
    }

    /* Individual Link Items */
    .nav-links li {
    margin-left: 0px;      /* Spacing between links */
    }

    /* The Anchor Links */
    .nav-links a {
    color: azure;
    text-decoration: none;  /* Removes the underline */
    font-size: 16px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    display: inline-block;
    transition: color 0.3s ease-in-out, transform 0.3s ease-in-out;
    padding: 18.5px;
    background-color:#6b3c3c;
    
    }
    /* Hover Effect */
    .nav-links a:hover {
    color: #000000; 
    transform: scale(1.03);
    background: #EA8484;
    }

    .nav-links a:active {
    transform: scale(0.98);
    }

    /* Content Padding (Optional) */
    /* Prevents your main page content from being hidden behind the fixed top bar */
    .main-content {
    margin-top: 80px; 
    padding: 20px;
    }
</style>
</head>

<body style="background-color:rgb(25, 28, 36);">
<nav class="top-bar">
  <div class="logo">The Board</div>
  <ul class="nav-links">
    <li><a href="main.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<h1>Contact Page</h1>
</body>
